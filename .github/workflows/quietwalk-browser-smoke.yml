name: QuietWalk Stage 3 checks

on:
  push:
    branches:
      - main
      - stage-2-map-guard
      - quietwalk-stage-3
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and browser test runner
        run: |
          npm install
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run source safety regression tests
        run: npm test

      - name: Run browser smoke test
        run: npm run test:browser
