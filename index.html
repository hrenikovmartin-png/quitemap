<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>QuietWalk — Краснодарский край</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }
    
    .region-label {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 15px;
      border-radius: 8px;
      font-weight: bold;
      color: #1e293b;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="region-label">📍 Краснодарский край</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Ваш ключ CARTO
    const CARTO_API_KEY = 'cb1_56xg_1_74efb1c0daaf793c6f4dd06c';

    // Ограничения по Краснодарскому краю
    const southWest = L.latLng(43.0, 36.5);
    const northEast = L.latLng(47.0, 41.5);
    const bounds = L.latLngBounds(southWest, northEast);

    // Создаем карту с ограничениями
    const map = L.map('map', {
      center: [45.0355, 38.9753], // Центр (Краснодар)
      zoom: 8,                    // Стартовый зум
      minZoom: 7,                 // Запрет на отдаление
      maxBounds: bounds,          // Запрет на уход за пределы края
      maxBoundsViscosity: 1.0
    });

    // Подключаем растровые тайлы CARTO (Voyager) с вашим ключом
    L.tileLayer(`https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=${CARTO_API_KEY}`, {
      attribution: '© OpenStreetMap © CARTO',
      bounds: bounds
    }).addTo(map);

    // Тестовый маркер при клике (чтобы проверить работу)
    map.on('click', function(e) {
        L.marker(e.latlng).addTo(map)
            .bindPopup(`Координаты:<br>Широта: ${e.latlng.lat.toFixed(4)}<br>Долгота: ${e.latlng.lng.toFixed(4)}`)
            .openPopup();
    });
  </script>
</body>
</html>
