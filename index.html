<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>QuietWalk — Краснодарский край</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }
    
    /* Добавим небольшую плашку с названием региона для красоты */
    .region-label {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 15px;
      border-radius: 8px;
      font-weight: bold;
      color: #1e293b;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="region-label">📍 Краснодарский край</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. Ограничиваем видимую область примерными координатами края
    // Юго-запад (Сочи/Анапа) и Северо-восток (граница с Ростовской обл.)
    const southWest = L.latLng(43.0, 36.5);
    const northEast = L.latLng(47.0, 41.5);
    const bounds = L.latLngBounds(southWest, northEast);

    // 2. Создаем карту с ограничениями
    const map = L.map('map', {
      center: [45.0355, 38.9753], // Центр (Краснодар)
      zoom: 8,                    // Стартовый зум (весь край)
      minZoom: 7,                 // Запрещаем отдаляться дальше (чтобы не видеть весь мир)
      maxBounds: bounds,          // Запрещаем перетаскивать карту за пределы края
      maxBoundsViscosity: 1.0     // 1.0 = жесткая привязка к границам (карта не пружинит)
    });

    // 3. Подключаем слой карты (используем CartoDB, так как OSM может блокировать)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CARTO',
      bounds: bounds // Серверу отправляем запросы только для этого региона
    }).addTo(map);

    // 4. (Опционально) Добавим маркер для проверки кликов
    map.on('click', function(e) {
        L.marker(e.latlng).addTo(map)
            .bindPopup(`Координаты:<br>Широта: ${e.latlng.lat.toFixed(4)}<br>Долгота: ${e.latlng.lng.toFixed(4)}`)
            .openPopup();
    });
  </script>
</body>
</html>
