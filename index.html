<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>QuietWalk — Поиск с подсказками</title>
  
  <!-- Стили Leaflet и плагина маршрутизации -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  
  <style>
    body { margin: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; }
    #sidebar { width: 340px; padding: 20px; background: #f8fafc; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 1000; display: flex; flex-direction: column; gap: 15px; }
    #map { flex: 1; }
    h2 { margin: 0; color: #1e293b; font-size: 20px; }
    p { margin: 0; color: #475569; font-size: 14px; line-height: 1.4; }
    .card { background: white; padding: 14px; border-radius: 10px; border-left: 5px solid #3b82f6; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .stat { font-weight: bold; font-size: 16px; margin-top: 6px; color: #0f172a; }
    button { padding: 10px; border: none; border-radius: 8px; background: #0f172a; color: white; cursor: pointer; font-size: 14px; margin-top: auto;}
    button:hover:not(:disabled) { background: #334155; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* Стили для поиска и выпадающего списка */
    .search-container { position: relative; display: flex; gap: 8px; }
    .search-container input { 
      flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; 
      font-size: 14px; outline: none; transition: border 0.2s;
    }
    .search-container input:focus { border-color: #3b82f6; }
    .search-container button { padding: 10px 15px; margin-top: 0; background: #3b82f6; }
    .search-container button:hover { background: #2563eb; }
    
    #suggestions {
      position: absolute; top: 100%; left: 0; right: 45px;
      background: white; border: 1px solid #cbd5e1; border-top: none;
      border-radius: 0 0 8px 8px; list-style: none; margin: 0; padding: 0;
      max-height: 200px; overflow-y: auto; z-index: 1001;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: none;
    }
    #suggestions li {
      padding: 10px; cursor: pointer; font-size: 13px;
      border-bottom: 1px solid #f1f5f9; color: #334155;
    }
    #suggestions li:hover { background: #f8fafc; color: #0f172a; }
    #suggestions li:last-child { border-bottom: none; }
    
    /* Прячем стандартную панель плагина */
    .leaflet-routing-container { display: none !important; }
  </style>
</head>
<body>

<div id="sidebar">
  <h2>🌿 QuietWalk</h2>
  
  <!-- БЛОК ПОИСКА С ПОДСКАЗКАМИ -->
  <div class="search-container">
    <input type="text" id="search-input" placeholder="кра - ул Красная..." autocomplete="off" oninput="handleSearchInput()" onkeypress="handleSearchEnter(event)">
    <button onclick="searchAddress()">🔍</button>
    <ul id="suggestions"></ul>
  </div>

  <p>Кликните на карту, чтобы поставить <b>точку А</b> (старт), затем <b>точку Б</b> (финиш).</p>
  
  <div class="card">
    <div>🔵 Пешеходный маршрут (по улицам)</div>
    <div class="stat" id="route-stats">Ожидание точек...</div>
  </div>

  <button id="reset-btn" onclick="resetMap()" disabled>Сбросить точки</button>
</div>

<div id="map"></div>

<!-- Подключаем Leaflet и плагин маршрутизации -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script>
  // --- НАСТРОЙКА КАРТЫ ---
  const CARTO_API_KEY = 'cb1_56xg_1_74efb1c0daaf793c6f4dd06c';
  const southWest = L.latLng(43.0, 36.5);
  const northEast = L.latLng(47.0, 41.5);
  const bounds = L.latLngBounds(southWest, northEast);

  const map = L.map('map', {
    center: [45.0355, 38.9753], // Краснодар
    zoom: 13,
    minZoom: 7,
    maxBounds: bounds,
    maxBoundsViscosity: 1.0
  });

  L.tileLayer(`https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=${CARTO_API_KEY}`, {
    attribution: '© OpenStreetMap © CARTO',
    bounds: bounds
  }).addTo(map);

  // --- ЛОГИКА МАРШРУТА ---
  let points = [];
  let markers = [];
  let routingControl = null;

  // --- ЖИВОЙ ПОИСК (АВТОДОПОЛНЕНИЕ) ---
  let searchTimeout = null;

  function handleSearchInput() {
    const query = document.getElementById('search-input').value.trim();
    const suggestionsBox = document.getElementById('suggestions');
    
    // Скрываем подсказки, если ввели меньше 3 символов
    if (query.length < 3) {
      suggestionsBox.style.display = 'none';
      return;
    }

    // Делаем задержку (debounce) в 500мс, чтобы не спамить API на каждую букву
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      fetchSuggestions(query);
    }, 500);
  }

  async function fetchSuggestions(query) {
    const suggestionsBox = document.getElementById('suggestions');
    
    try {
      // Ограничиваем поиск Краснодарским краем
      const viewbox = `${southWest.lng},${northEast.lat},${northEast.lng},${southWest.lat}`;
      // limit=5 — показываем только 5 лучших вариантов
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&viewbox=${viewbox}&bounded=1&limit=5`;
      
      const response = await fetch(url, {
        headers: { 'Accept-Language': 'ru' }
      });
      const data = await response.json();

      if (data && data.length > 0) {
        suggestionsBox.innerHTML = '';
        data.forEach(item => {
          const li = document.createElement('li');
          // Берем только первые две части адреса для красоты
          const shortName = item.display_name.split(',').slice(0, 2).join(',');
          li.innerText = shortName;
          li.title = item.display_name;
          
          li.onclick = () => {
            selectSuggestion(item);
          };
          suggestionsBox.appendChild(li);
        });
        suggestionsBox.style.display = 'block';
      } else {
        suggestionsBox.style.display = 'none';
      }
    } catch (err) {
      console.error('Ошибка поиска:', err);
    }
  }

  function selectSuggestion(item) {
    const lat = parseFloat(item.lat);
    const lon = parseFloat(item.lon);
    
    // Заполняем инпут выбранным названием
    document.getElementById('search-input').value = item.display_name.split(',').slice(0, 2).join(',');
    document.getElementById('suggestions').style.display = 'none';

    // Плавно летим к месту
    map.flyTo([lat, lon], 15, { duration: 1.5 });
    
    // Ставим временный синий маркер
    if (window.searchMarker) map.removeLayer(window.searchMarker);
    window.searchMarker = L.circleMarker([lat, lon], {
      radius: 10, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.5, weight: 2
    }).addTo(map).bindPopup(`Найдено: ${item.display_name}`).openPopup();
  }

  function handleSearchEnter(e) {
    if (e.key === 'Enter') {
      // Если нажали Enter, а подсказки открыты — выбираем первую
      const firstSuggestion = document.querySelector('#suggestions li');
      if (firstSuggestion && document.getElementById('suggestions').style.display === 'block') {
        firstSuggestion.click();
      } else {
        searchAddress(); // Иначе делаем обычный поиск
      }
    }
  }

  async function searchAddress() {
    const query = document.getElementById('search-input').value.trim();
    if (!query) return;

    const searchBtn = document.querySelector('.search-container button');
    searchBtn.innerText = '⏳';
    
    try {
      const viewbox = `${southWest.lng},${northEast.lat},${northEast.lng},${southWest.lat}`;
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&viewbox=${viewbox}&bounded=1&limit=1`;
      
      const response = await fetch(url, {
        headers: { 'Accept-Language': 'ru' }
      });
      const data = await response.json();

      if (data && data.length > 0) {
        selectSuggestion(data[0]);
      } else {
        alert('Ничего не найдено. Попробуйте уточнить запрос.');
      }
    } catch (err) {
      console.error(err);
      alert('Ошибка при поиске. Проверьте интернет.');
    } finally {
      searchBtn.innerText = '🔍';
    }
  }

  // Закрываем подсказки при клике мимо
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-container')) {
      document.getElementById('suggestions').style.display = 'none';
    }
  });

  // --- ЛОГИКА КЛИКОВ И МАРШРУТОВ ---
  map.on('click', function (e) {
    if (points.length >= 2) return;

    points.push(e.latlng);

    const marker = L.marker(e.latlng).addTo(map)
      .bindPopup(points.length === 1 ? 'Старт (А)' : 'Финиш (Б)').openPopup();
    markers.push(marker);

    if (points.length === 2) {
      buildRealRoute(points[0], points[1]);
    }
  });

  function buildRealRoute(start, end) {
    if (routingControl) {
      map.removeControl(routingControl);
    }

    routingControl = L.Routing.control({
      waypoints: [start, end],
      router: L.Routing.osrmv1({
        serviceUrl: 'https://routing.openstreetmap.de/routed-foot/route/v1',
        profile: 'foot'
      }),
      show: false, 
      createMarker: function() { return null; }, 
      lineOptions: {
        styles: [{ color: '#3b82f6', opacity: 0.9, weight: 6 }]
      }
    }).addTo(map);

    routingControl.on('routesfound', function (e) {
      const route = e.routes[0];
      const summary = route.summary;
      
      const minutes = Math.round(summary.totalTime / 60);
      const km = (summary.totalDistance / 1000).toFixed(2);
      
      document.getElementById('route-stats').innerHTML = 
        `<span style="color:#3b82f6">${minutes} мин (${km} км)</span><br>
         <span style="font-size: 12px; color: #64748b;">Пешеходный маршрут</span>`;
    });

    routingControl.on('routingerror', function (e) {
      console.error('Ошибка маршрута:', e);
      document.getElementById('route-stats').innerText = 'Не удалось построить маршрут';
    });

    map.fitBounds([start, end], { padding: [50, 50] });
  }

  // Сброс
  function resetMap() {
    points = [];
    markers.forEach(m => map.removeLayer(m));
    if (routingControl) {
      map.removeControl(routingControl);
      routingControl = null;
    }
    if (window.searchMarker) {
      map.removeLayer(window.searchMarker);
      window.searchMarker = null;
    }
    markers = [];
    document.getElementById('route-stats').innerText = 'Ожидание точек...';
    document.getElementById('search-input').value = '';
    document.getElementById('suggestions').style.display = 'none';
  }

  document.getElementById('reset-btn').disabled = false;
</script>

</body>
</html>
